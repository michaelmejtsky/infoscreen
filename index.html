  <style>
    html, body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
      touch-action: pan-y;
      background: #f4f6fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      max-width: 100vw;
      height: 100%;
      border: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #f4f6fa;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f4f6fa, #eef1fb);
    }

    .logo-badge {
      width:72px;
      height:72px;
      object-fit:contain;
      display:block;
      margin:0 auto 12px;
      padding:5px;
      border-radius:18px;
      background:#fff;
      border:1px solid #e4e8f0;
      box-shadow:0 8px 20px rgba(38,54,111,.08);
    }

    .card {
      width: min(420px, calc(100% - 32px));
      padding: 26px 22px;
      background: #fff;
      border: 1px solid #e4e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(38,54,111,.08);
      text-align: center;
    }

    .brand {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      color: #34499a;
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      color: #25346f;
    }

    p {
      margin: 8px 0 0;
      color: #718096;
      font-size: 12px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 20px auto 0;
      border-radius: 50%;
      border: 4px solid #e4e8f0;
      border-top-color: #34499a;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
